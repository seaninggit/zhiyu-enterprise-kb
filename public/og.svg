<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#123f3a"/>
      <stop offset="50%" stop-color="#1a5c55"/>
      <stop offset="100%" stop-color="#0d332f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39a6bf"/>
      <stop offset="100%" stop-color="#277d9f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="42" x2="1200" y2="42" stroke="white" stroke-width="1"/>
    <line x1="0" y1="84" x2="1200" y2="84" stroke="white" stroke-width="1"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="white" stroke-width="1"/>
    <line x1="0" y1="168" x2="1200" y2="168" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="white" stroke-width="1"/>
    <line x1="0" y1="294" x2="1200" y2="294" stroke="white" stroke-width="1"/>
    <line x1="0" y1="336" x2="1200" y2="336" stroke="white" stroke-width="1"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="462" x2="1200" y2="462" stroke="white" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="white" stroke-width="1"/>
    <line x1="0" y1="546" x2="1200" y2="546" stroke="white" stroke-width="1"/>
    <line x1="0" y1="588" x2="1200" y2="588" stroke="white" stroke-width="1"/>
  </g>

  <!-- Brand mark -->
  <rect x="80" y="100" width="80" height="80" rx="20" fill="url(#brand)"/>
  <text x="120" y="157" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="52" font-weight="700" font-style="italic" fill="white">Z</text>

  <!-- Title -->
  <text x="190" y="148" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="6">知域</text>
  <text x="190" y="178" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8eb8b0" letter-spacing="8" font-weight="500">ZHIYU · ENTERPRISE KNOWLEDGE HUB</text>

  <!-- Divider -->
  <line x1="80" y1="240" x2="1120" y2="240" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Description -->
  <text x="80" y="310" font-family="Georgia,'Songti SC',serif" font-size="32" fill="white" font-weight="500" letter-spacing="2">让企业知识可信、可用、可追溯</text>
  <text x="80" y="360" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8eb8b0" line-height="1.8">覆盖上传、审核、发布、权限隔离、语义检索与 AI 可信问答的一体化知识管理平台</text>

  <!-- Feature pills -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="white" fill-opacity="0.08"/>
    <text x="75" y="24" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b9d0cb"> 文件解析 + OCR</text>

    <rect x="165" y="0" width="150" height="36" rx="18" fill="white" fill-opacity="0.08"/>
    <text x="240" y="24" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b9d0cb"> 审核发布流程</text>

    <rect x="330" y="0" width="150" height="36" rx="18" fill="white" fill-opacity="0.08"/>
    <text x="405" y="24" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b9d0cb"> 行级权限隔离</text>

    <rect x="495" y="0" width="150" height="36" rx="18" fill="white" fill-opacity="0.08"/>
    <text x="570" y="24" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b9d0cb"> 语义向量检索</text>

    <rect x="660" y="0" width="150" height="36" rx="18" fill="white" fill-opacity="0.08"/>
    <text x="735" y="24" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b9d0cb"> AI 引用问答</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="white" fill-opacity="0.04"/>
  <text x="80" y="615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b9992">企业知识中台 · TypeScript + React + Cloudflare Workers + D1 + DeepSeek</text>
</svg>
